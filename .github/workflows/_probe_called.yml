---
name: probe called
on:
  workflow_call: {}
permissions: {}
jobs:
  called:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Can this job mint an OIDC token?
        run: |
          if [[ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]]; then
              echo "INHERITED: id-token available in the called workflow"
          else
              echo "NOT INHERITED: no OIDC token here"; exit 1
          fi
